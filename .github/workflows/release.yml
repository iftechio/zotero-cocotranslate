name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check the tag against package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm run build -- --env prod
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "build/release/zotero-release/$VERSION/cocotranslate-$VERSION.xpi" cocotranslate.xpi
          gh release create "$GITHUB_REF_NAME" cocotranslate.xpi --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
